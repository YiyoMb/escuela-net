name: CI/CD Pipeline

# Cuándo se ejecuta este pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutarlo manualmente

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # JOB 1: Compilar y probar
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    # 1. Descargar el código
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configurar .NET 10
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. Restaurar dependencias
    - name: Restore dependencies
      run: dotnet restore

    # 4. Compilar el proyecto
    - name: Build
      run: dotnet build --no-restore --configuration Release

    # 5. Ejecutar pruebas
    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal

  # JOB 2: Construir y subir imagen Docker
  docker-build-push:
    name: Build and Push Docker Image
    needs: build-and-test  # Solo se ejecuta si las pruebas pasan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    # 1. Descargar el código
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configurar Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Login a GitHub Container Registry
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 4. Extraer metadata para Docker
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          latest

    # 5. Construir y subir imagen Docker
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./SistemaEscolar.API
        file: ./SistemaEscolar.API/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max