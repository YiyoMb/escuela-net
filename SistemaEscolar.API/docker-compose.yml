services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sistemaescolar-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Pass2025!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistemaescolar-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=SistemaEscolarDB;User Id=sa;Password=Pass2025!;TrustServerCertificate=True;Encrypt=False;
    depends_on:
      - sqlserver
    restart: on-failure

volumes:
  sqlserver_data: